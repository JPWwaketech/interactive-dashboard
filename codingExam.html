<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mortgage Amortization Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
       
        #output {
            margin-top: 20px;
        }

        .month {
            margin-left: 20px;
        }

</style>
</head>
<body>

    <p>Name: James Watson</p>
    <p>Email: jpwatson2@my.waketech.edu</p>
    <p>Date: 10/19/2026 <script>document.write(new Date().toLocaleDateString());</script></p>

    <button id="Button1">Calculate Mortgage</button>

    <div id="output"></div>
    <script>

        document.getElementById("Button1").addEventListener("click", function () {

            const interestRate = 0.0575;

            let loanAmount = parseFloat(
                prompt("Enter the loan amount (without commas):")
            );

            let termYears = parseInt(
                prompt("Enter the loan term in years (15 or 30):")
            );

            if (termYears !== 15 && termYears !== 30) {
                alert("Loan term must be 15 or 30 years.");
                return;
            }

            let monthlyPayment = (
                ((interestRate / 12) * loanAmount) /
                (1 - Math.pow(1 + (interestRate / 12), (termYears * -12)))
            );

            let totalInterest =
                (monthlyPayment * termYears * 12) - loanAmount;

            let totalMortgageAmount =
                loanAmount + totalInterest;

     let output = document.getElementById("output");

            output.innerHTML = "";

            output.innerHTML +=
          "<h2>Mortgage Information</h2>";

            output.innerHTML +=
              "<p><strong>Mortgage Term:</strong> "
               
                + termYears +
               
                " years</p>";

            output.innerHTML +=
               "<p><strong>Interest Rate:</strong> "
             
                + (interestRate * 100).toFixed(2) +
                "%</p>";

           output.innerHTML +=
                "<p><strong>Mortgage Amount:</strong> $"

                + loanAmount.toFixed(2) +

                "</p>";

            output.innerHTML +=
                "<p><strong>Total Interest:</strong> $"

                + totalInterest.toFixed(2) +

                "</p>";

            output.innerHTML +=
                "<p><strong>Total Mortgage Amount:</strong> $"

                + totalMortgageAmount.toFixed(2) +

                "</p>";

            output.innerHTML +=
                "<h3>Amortization Schedule</h3>";

            let balance = totalMortgageAmount;

            let month = 1;

            while (balance > 0) {

                balance = balance - monthlyPayment;

                if (balance < 0) {
                    balance = 0;
                }

             output.innerHTML +=
                    "<div class='month'>" +

                    "Month " + month +

                    " | Payment: $" +

                    monthlyPayment.toFixed(2) +

                    " | Balance: $" +

                    balance.toFixed(2) +

                    "</div>";

                month++;

                if (balance === 0) {

                    output.innerHTML +=
                        "<h3>This is the Ending Amortization Calculator...</h3>";
                    break;
                }
            }
        });
    </script>
</body>
</html>
